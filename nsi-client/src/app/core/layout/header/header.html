<header class="header">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16M4 12h16M4 19h10" />
      </svg>
    </span>
    NSI ცნობარები
  </a>

  <div class="dict-select">
    <button type="button" class="dict-button" aria-haspopup="menu" [attr.aria-expanded]="menuOpen()"
            (click)="toggleMenu()">
      <span class="dict-current">{{ current()?.label ?? 'აირჩიეთ ცნობარი' }}</span>
      <svg class="chevron" [class.open]="menuOpen()" viewBox="0 0 24 24" width="16" height="16" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    @if (menuOpen()) {
      <ul class="dict-menu" role="menu" aria-label="ცნობარები">
        @for (item of navItems; track item.path) {
          <li role="none">
            <a role="menuitem" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
               (click)="closeMenu()">
              <span class="dict-code">{{ item.label }}</span>
              <span class="dict-title">{{ item.title }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </div>

  <div class="role-switch" role="group" aria-label="რეჟიმი">
    <button type="button" [class.active]="roles.isAdmin()" [attr.aria-pressed]="roles.isAdmin()"
            (click)="roles.setRole('Admin')">ადმინი</button>
    <button type="button" [class.active]="!roles.isAdmin()" [attr.aria-pressed]="!roles.isAdmin()"
            (click)="roles.setRole('User')">მომხმარებელი</button>
  </div>
</header>
